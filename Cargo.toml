[package]
name = "gale-led"
version = "1.1.1"
edition = "2024"
rust-version = "1.85"
description = "Static RGB LED control for Google Wifi Gale routers running OpenWrt"
license = "MIT"
repository = "https://github.com/firebadnofire/google-wifi-led-control"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true

[lib]
name = "gale_led"
path = "src/lib.rs"

[[bin]]
name = "gale-led"
path = "src/main.rs"
