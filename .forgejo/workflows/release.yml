name: Build and publish OpenWrt release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to build
        required: true
        type: string
      dry_run:
        description: Build and sign without publishing releases
        required: true
        default: false
        type: boolean

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: node:20-bookworm@sha256:8f693eaa7e0a8e71560c9a82b55fd54c2ae920a2ba5d2cde28bac7d1c01c9ba5
    env:
      OPENWRT_VERSION: '25.12.2'
      OPENWRT_TARGET: ipq40xx
      OPENWRT_SUBTARGET: chromium
      OPENWRT_ARCH: arm_cortex-a7_neon-vfpv4
      SDK_FILE: openwrt-sdk-25.12.2-ipq40xx-chromium_gcc-14.3.0_musl_eabi.Linux-x86_64.tar.zst
      SDK_SHA256: 574197ecb6f0f858c76d674088a936cb5fbedfa6c352614643eb66e0b3084711
      FORGEJO_API_URL: ${{ forgejo.api_url }}
      FORGEJO_REPOSITORY: ${{ forgejo.repository }}
      FORGEJO_TOKEN: ${{ forgejo.token }}
      GH_KEY: ${{ secrets.GH_KEY }}
      CI_KEY: ${{ secrets.CI_KEY }}
      CI_KEY_PASSPHRASE: ${{ secrets.CI_KEY_PASSPHRASE }}

    steps:
      - name: Check out requested source tag
        if: ${{ env.LOCAL_RELEASE_DRY_RUN != '1' }}
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ inputs.tag || forgejo.ref }}

      - name: Install build dependencies and pinned Rust toolchain
        run: |
          set -euo pipefail
          cd "${LOCAL_WORKSPACE:-${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is not set}}"
          printf 'Using workflow workspace: %s\n' "$PWD"
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install --yes --no-install-recommends \
            bash build-essential bzip2 ca-certificates curl file gawk gettext git gnupg jq \
            libncurses-dev libssl-dev make perl python3 python3-distutils python3-setuptools \
            rsync tar unzip wget zlib1g-dev zstd
          rm -rf /var/lib/apt/lists/*

          rustup_url='https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init'
          rustup_sha256='20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c'
          curl --fail --location --retry 3 --output /tmp/rustup-init "$rustup_url"
          printf '%s  %s\n' "$rustup_sha256" /tmp/rustup-init | sha256sum --check --strict
          chmod 0755 /tmp/rustup-init
          CARGO_HOME=/root/.cargo RUSTUP_HOME=/root/.rustup /tmp/rustup-init \
            -y --no-modify-path --profile minimal --default-toolchain 1.90.0 \
            --component rustfmt,clippy --target armv7-unknown-linux-musleabihf
          rm -f /tmp/rustup-init
          for command in cargo rustc rustup rustfmt clippy-driver; do
            ln -sf "/root/.cargo/bin/$command" "/usr/local/bin/$command"
          done

      - name: Validate tag and source version
        env:
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          cd "${LOCAL_WORKSPACE:-${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is not set}}"
          tag=${MANUAL_TAG:-${LOCAL_RELEASE_TAG:-${FORGEJO_REF_NAME:-}}}
          if [[ ! $tag =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-([0-9A-Za-z]+([.-][0-9A-Za-z]+)*))?$ ]]; then
            echo "release tag must be vMAJOR.MINOR.PATCH with an optional SemVer prerelease" >&2
            exit 1
          fi
          version=${tag#v}
          cargo_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          package_version=$(sed -n 's/^PKG_VERSION:=//p' Makefile | head -n1)
          if [[ $cargo_version != "$version" || $package_version != "$version" ]]; then
            echo "tag $tag does not match Cargo.toml ($cargo_version) and Makefile ($package_version)" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$tag" >> "$FORGEJO_ENV"
          echo "RELEASE_VERSION=$version" >> "$FORGEJO_ENV"
          if [[ $version == *-* ]]; then
            echo 'RELEASE_PRERELEASE=true' >> "$FORGEJO_ENV"
          else
            echo 'RELEASE_PRERELEASE=false' >> "$FORGEJO_ENV"
          fi

      - name: Verify runner dependencies
        run: |
          set -euo pipefail
          cd "${LOCAL_WORKSPACE:-${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is not set}}"
          for command in bash cargo rustc rustup rustfmt clippy-driver curl jq gpg python3 tar zstd sha256sum file make gcc g++ rsync; do
            command -v "$command" >/dev/null || { echo "required runner command missing: $command" >&2; exit 1; }
          done
          rustc --version
          cargo --version

      - name: Validate and test source
        run: |
          set -euo pipefail
          cd "${LOCAL_WORKSPACE:-${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is not set}}"
          cargo fmt --all -- --check
          cargo test --all-targets --locked
          cargo clippy --all-targets --locked -- -D warnings
          bash ./scripts/validate-static.sh

      - name: Restore OpenWrt and Cargo caches
        if: ${{ env.LOCAL_RELEASE_DRY_RUN != '1' }}
        uses: https://data.forgejo.org/actions/cache@v4.2.4
        with:
          path: |
            .cache/openwrt
            .openwrt-sdk/dl
            ~/.cargo/registry
            ~/.cargo/git
          key: openwrt-${{ runner.os }}-25.12.2-ipq40xx-chromium-574197ec

      - name: Download and verify official OpenWrt SDK
        run: |
          set -euo pipefail
          cd "${LOCAL_WORKSPACE:-${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is not set}}"
          mkdir -p .cache/openwrt .openwrt-sdk
          archive=".cache/openwrt/$SDK_FILE"
          if [[ ! -f $archive ]]; then
            curl --fail --location --retry 3 --output "$archive" \
              "https://downloads.openwrt.org/releases/$OPENWRT_VERSION/targets/$OPENWRT_TARGET/$OPENWRT_SUBTARGET/$SDK_FILE"
          fi
          printf '%s  %s\n' "$SDK_SHA256" "$archive" | sha256sum --check --strict
          tar --zstd --extract --file "$archive" --directory .openwrt-sdk --strip-components=1

      - name: Build installable OpenWrt packages
        run: |
          set -euo pipefail
          cd "${LOCAL_WORKSPACE:-${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is not set}}"
          rm -rf .openwrt-sdk/package/gale-led
          mkdir -p .openwrt-sdk/package/gale-led
          rsync -a --delete \
            --exclude='.git/' --exclude='.openwrt-sdk/' --exclude='release/' --exclude='target/' \
            ./ .openwrt-sdk/package/gale-led/
          {
            echo 'CONFIG_PACKAGE_gale-led=m'
            echo 'CONFIG_PACKAGE_luci-app-gale-led=m'
          } >> .openwrt-sdk/.config
          make -C .openwrt-sdk defconfig
          make -C .openwrt-sdk package/gale-led/clean
          make -C .openwrt-sdk package/gale-led/compile V=s

      - name: Collect and inspect release packages
        run: |
          set -euo pipefail
          cd "${LOCAL_WORKSPACE:-${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is not set}}"
          rm -rf release
          mkdir release
          mapfile -t packages < <(find .openwrt-sdk/bin/packages -type f \
            \( -name "gale-led-${RELEASE_VERSION}-*.apk" -o -name "luci-app-gale-led-${RELEASE_VERSION}-*.apk" \) \
            | LC_ALL=C sort)
          if (( ${#packages[@]} != 2 )); then
            printf 'expected exactly two APKs, found %d\n' "${#packages[@]}" >&2
            printf '%s\n' "${packages[@]}" >&2
            exit 1
          fi
          cp -- "${packages[@]}" release/
          test "$(find release -maxdepth 1 -name '*.apk' | wc -l)" -eq 2
          file release/*.apk

      - name: Sign packages and checksums
        run: |
          set -euo pipefail
          cd "${LOCAL_WORKSPACE:-${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is not set}}"
          : "${CI_KEY:?CI_KEY secret is required}"
          : "${CI_KEY_PASSPHRASE:?CI_KEY_PASSPHRASE secret is required}"
          export GNUPGHOME
          GNUPGHOME=$(mktemp -d)
          cleanup() { rm -rf -- "$GNUPGHOME"; }
          trap cleanup EXIT
          chmod 700 "$GNUPGHOME"
          printf '%s' "$CI_KEY" | gpg --batch --import
          passphrase_file="$GNUPGHOME/passphrase"
          printf '%s' "$CI_KEY_PASSPHRASE" > "$passphrase_file"
          chmod 600 "$passphrase_file"
          mapfile -t packages < <(find release -maxdepth 1 -type f -name '*.apk' -printf '%f\n' | LC_ALL=C sort)
          (
            cd release
            sha256sum "${packages[@]}" > SHA256SUMS
            for package in "${packages[@]}"; do
              gpg --batch --yes --pinentry-mode loopback --passphrase-file "$passphrase_file" \
                --armor --detach-sign "$package"
            done
            gpg --batch --yes --pinentry-mode loopback --passphrase-file "$passphrase_file" \
              --armor --detach-sign SHA256SUMS
          )
          test "$(find release -maxdepth 1 -name '*.asc' | wc -l)" -eq 3
          gpg --batch --verify release/SHA256SUMS.asc release/SHA256SUMS
          for package in release/*.apk; do gpg --batch --verify "$package.asc" "$package"; done
          (cd release && sha256sum --check --strict SHA256SUMS)

      - name: Publish Forgejo and GitHub releases
        if: ${{ env.LOCAL_RELEASE_DRY_RUN != '1' && !inputs.dry_run }}
        env:
          RELEASE_BODY: |
            OpenWrt 25.12.x packages for Google Wifi (Gale), target ipq40xx/chromium.

            Verify package bytes with SHA256SUMS and the accompanying armored GPG signatures before installation.
        run: |
          set -euo pipefail
          cd "${LOCAL_WORKSPACE:-${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is not set}}"
          : "${FORGEJO_TOKEN:?automatic Forgejo token is required}"
          : "${GH_KEY:?GH_KEY secret is required}"
          export RELEASE_NAME="Google Wifi LED Control $RELEASE_TAG"
          bash ./scripts/publish-release.sh forgejo release
          bash ./scripts/publish-release.sh github release
